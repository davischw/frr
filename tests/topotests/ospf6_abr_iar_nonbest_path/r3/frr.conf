interface r3-eth0
 ipv6 address 2001:db8:2::3/64
 ipv6 ospf6 area 0.0.0.2
 ipv6 ospf6 cost 10
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 2
 ipv6 ospf6 dead-interval 10
exit
!
interface r3-eth1
 ipv6 address 2001:db8:3::3/64
 ipv6 ospf6 area 0.0.0.2
 ipv6 ospf6 cost 10
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 2
 ipv6 ospf6 dead-interval 10
exit
!
! Backbone link to r4, enabled by the test.
interface r3-eth2
 ipv6 address 2001:db8:4::3/64
 ipv6 ospf6 cost 5
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 hello-interval 2
 ipv6 ospf6 dead-interval 10
exit
!
ipv6 route 2001:db8:e3::/56 Null0
!
router ospf6
 ospf6 router-id 3.3.3.3
 redistribute static
exit
