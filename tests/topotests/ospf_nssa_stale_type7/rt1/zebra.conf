hostname rt1
log file zebra.log
!
interface lo
 ip address 1.1.1.1/32
!
interface eth-rt2
 ip address 10.0.12.1/24
!
interface eth-rt3
 ip address 10.0.13.1/24
!
! The nexthop is covered by an OSPF interface, so it's used as the forwarding
! address of the NSSA-LSA.
ip route 10.0.115.0/24 10.0.13.30
!
ip forwarding
!
