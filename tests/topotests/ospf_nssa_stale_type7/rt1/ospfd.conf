hostname rt1
log file ospfd.log
!
debug ospf event
debug ospf lsa
debug ospf nssa
debug ospf graceful-restart
!
interface eth-rt2
 ip ospf network point-to-point
 ip ospf area 1
 ip ospf hello-interval 2
 ip ospf dead-interval 10
!
interface eth-rt3
 ip ospf network point-to-point
 ip ospf area 0
 ip ospf hello-interval 2
 ip ospf dead-interval 10
!
router ospf
 router-id 1.1.1.1
 capability opaque
 redistribute static
 graceful-restart grace-period 120
 graceful-restart helper enable
 area 1 nssa translate-always
!
