hostname rt2
log file ospfd.log
!
debug ospf event
debug ospf lsa
debug ospf nssa
!
interface eth-rt1
 ip ospf network point-to-point
 ip ospf area 1
 ip ospf hello-interval 2
 ip ospf dead-interval 10
!
router ospf
 router-id 2.2.2.2
 capability opaque
 graceful-restart helper enable
 area 1 nssa
!
