hostname r3
log file ospf6d.log
!
! r3 anchors the backbone so r1 is a genuine ABR.  The backbone area is
! not stub/NSSA, so re-advertising the stale ASBR brouter route into it
! reaches assert(route_area) in ospf6_abr_originate_summary_to_area().
!
interface r3-eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
!
router ospf6
 ospf6 router-id 10.0.0.3
 log-adjacency-changes detail
!
line vty
 exec-timeout 0 0
!
