hostname r1
log file ospf6d.log
!
! R1 is the ABR that crashes: it holds the backbone (to r3) plus the NSSA
! area 0.0.0.1 (to r2).  r2 is itself a border router inside area 0.0.0.1,
! so r1's brouter table gets a ROUTER entry tagged path.area_id = 0.0.0.1.
!
debug ospf6 abr
debug ospf6 nssa
!
interface r1-eth0
 ipv6 ospf6 area 0.0.0.0
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
!
interface r1-eth1
 ipv6 ospf6 area 0.0.0.1
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
!
router ospf6
 ospf6 router-id 10.0.0.1
 log-adjacency-changes detail
 area 0.0.0.1 nssa default-information-originate metric 10
!
line vty
 exec-timeout 0 0
!
