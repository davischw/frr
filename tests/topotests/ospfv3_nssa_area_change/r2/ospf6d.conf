hostname r2
log file ospf6d.log
!
! r2 is an ASBR inside NSSA area 0.0.0.1: it redistributes a connected
! prefix, so it originates NSSA Type-7 LSAs.  r1 (the NSSA ABR/translator)
! therefore installs a border-router route to r2 with the E-bit set and
! path.area_id = 0.0.0.1 in its instance-wide brouter table.  That E-bit
! entry is what reaches assert(route_area) in
! ospf6_abr_originate_summary_to_area() once area 0.0.0.1 is deleted on r1.
!
interface r2-eth0
 ipv6 ospf6 area 0.0.0.1
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
!
router ospf6
 ospf6 router-id 10.0.0.2
 log-adjacency-changes detail
 area 0.0.0.1 nssa
 redistribute connected
!
line vty
 exec-timeout 0 0
!
