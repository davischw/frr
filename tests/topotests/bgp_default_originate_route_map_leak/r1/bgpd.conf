!
router bgp 65001
 no bgp ebgp-requires-policy
 neighbor 192.168.1.2 remote-as 65002
 neighbor 192.168.1.2 timers 1 3
 neighbor 192.168.1.2 timers connect 1
 neighbor 192.168.2.3 remote-as 65003
 neighbor 192.168.2.3 timers 1 3
 neighbor 192.168.2.3 timers connect 1
 address-family ipv4 unicast
  neighbor 192.168.2.3 default-originate route-map default-originate
  neighbor 192.168.2.3 route-map deny-all out
 exit-address-family
!
! No match clause: the route-map is applied to every path in the BGP RIB
route-map default-originate permit 10
 set as-path prepend 65001 65001 65001 65001 65001
!
route-map deny-all deny 10
!
