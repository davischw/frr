debug ospf6 nssa
debug ospf6 lsa nssa originate
!
interface r2-eth0
 ipv6 address 2001:db8:16::2/64
 ipv6 ospf6 area 0.0.3.230
 ipv6 ospf6 cost 10
 ipv6 ospf6 hello-interval 2
 ipv6 ospf6 dead-interval 10
exit
!
interface r2-eth1
 ipv6 address 2001:db8:200::2/64
exit
!
ipv6 route ::/0 2001:db8:200::3
ipv6 route 2001:db8:100::/64 2001:db8:200::3
!
ipv6 prefix-list EXTERNAL seq 5 permit 2001:db8:100::/64
!
route-map STATIC-TO-OSPF6 permit 10
 match ipv6 address prefix-list EXTERNAL
exit
!
router ospf6
 ospf6 router-id 10.151.192.167
 redistribute static route-map STATIC-TO-OSPF6
 area 0.0.3.230 nssa default-information-originate metric 1 metric-type 2
exit
