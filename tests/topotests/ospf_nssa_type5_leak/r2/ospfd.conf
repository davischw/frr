hostname r2
log file ospfd.log
!
debug ospf nssa
debug ospf lsa
!
interface eth-r1
 ip ospf area 0.0.0.3
 ip ospf hello-interval 2
 ip ospf dead-interval 8
!
interface eth-r3
 ip ospf area 0.0.0.0
 ip ospf hello-interval 2
 ip ospf dead-interval 8
!
router ospf
 ospf router-id 2.2.2.2
 redistribute connected metric 1 metric-type 1
 redistribute static metric 1
 area 0.0.0.3 nssa translate-always no-summary
!
