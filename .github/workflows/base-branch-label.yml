name: Add base branch label

on:
  pull_request_target:
    types:
      - opened
      - reopened

jobs:
  label:
    runs-on:
      group: Debian13
      labels: [native]
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Label with the base branch name. For frr-dpd-x.y* branches, also
      # add the x.y version as label (e.g. frr-dpd-8.4-devel -> 8.4).
      - name: Add base branch labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          labels=(-f "labels[]=$BASE_REF")
          if [[ "$BASE_REF" =~ ^frr-dpd-([0-9]+\.[0-9]+) ]]; then
            labels+=(-f "labels[]=${BASH_REMATCH[1]}")
          fi
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/labels" \
            "${labels[@]}" > /dev/null
